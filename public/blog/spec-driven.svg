<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Three stacked documents — constitution, feature spec, validation">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EEF1F4"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg3)"/>
  <circle cx="1080" cy="100" r="240" fill="#4F8F6B" opacity="0.07"/>
  <circle cx="120" cy="540" r="240" fill="#6E54A8" opacity="0.07"/>

  <rect x="60" y="60" width="1080" height="510" rx="32" stroke="#1C1F24" stroke-opacity="0.14" stroke-width="2" fill="none"/>

  <line x1="100" y1="130" x2="160" y2="130" stroke="#4F8F6B" stroke-width="3"/>
  <text x="100" y="166" fill="#2E5A45" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="700" letter-spacing="3">SPEC-DRIVEN</text>

  <text x="100" y="244" fill="#0F1218" font-family="Inter, system-ui, sans-serif" font-size="60" font-weight="800" letter-spacing="-2.4">Agent is muscle.</text>
  <text x="100" y="316" fill="#0F1218" font-family="Inter, system-ui, sans-serif" font-size="60" font-weight="800" letter-spacing="-2.4">Spec is brain.</text>

  <text x="100" y="370" fill="#626A73" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="500">Constitution · Feature spec · Validation.</text>

  <!-- stacked spec cards -->
  <g transform="translate(680, 180)">
    <!-- card 3 -->
    <g transform="translate(40, 0)">
      <rect x="0" y="0" width="320" height="140" rx="14" fill="#DCEADF" stroke="#4F8F6B" stroke-opacity="0.4" stroke-width="1.5"/>
      <text x="20" y="34" fill="#2E5A45" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="3">VALIDATION</text>
      <line x1="20" y1="50" x2="120" y2="50" stroke="#4F8F6B" stroke-width="1.5"/>
      <text x="20" y="78" fill="#1C1F24" font-family="Inter, system-ui, sans-serif" font-size="14">— test cases</text>
      <text x="20" y="100" fill="#1C1F24" font-family="Inter, system-ui, sans-serif" font-size="14">— manual checks</text>
      <text x="20" y="122" fill="#1C1F24" font-family="Inter, system-ui, sans-serif" font-size="14">— expected outputs</text>
    </g>

    <!-- card 2 -->
    <g transform="translate(20, 90)">
      <rect x="0" y="0" width="320" height="140" rx="14" fill="#ECE5F6" stroke="#6E54A8" stroke-opacity="0.45" stroke-width="1.5"/>
      <text x="20" y="34" fill="#533F86" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="3">FEATURE SPEC</text>
      <line x1="20" y1="50" x2="120" y2="50" stroke="#6E54A8" stroke-width="1.5"/>
      <text x="20" y="78" fill="#1C1F24" font-family="Inter, system-ui, sans-serif" font-size="14">— user problem</text>
      <text x="20" y="100" fill="#1C1F24" font-family="Inter, system-ui, sans-serif" font-size="14">— scope &amp; non-goals</text>
      <text x="20" y="122" fill="#1C1F24" font-family="Inter, system-ui, sans-serif" font-size="14">— rollout plan</text>
    </g>

    <!-- card 1 -->
    <g transform="translate(0, 180)">
      <rect x="0" y="0" width="320" height="140" rx="14" fill="#FFFFFF" stroke="#C76A3F" stroke-opacity="0.5" stroke-width="1.5"/>
      <text x="20" y="34" fill="#A44F29" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="3">CONSTITUTION</text>
      <line x1="20" y1="50" x2="120" y2="50" stroke="#C76A3F" stroke-width="1.5"/>
      <text x="20" y="78" fill="#1C1F24" font-family="Inter, system-ui, sans-serif" font-size="14">— mission</text>
      <text x="20" y="100" fill="#1C1F24" font-family="Inter, system-ui, sans-serif" font-size="14">— stack decisions</text>
      <text x="20" y="122" fill="#1C1F24" font-family="Inter, system-ui, sans-serif" font-size="14">— testing conventions</text>
    </g>
  </g>

  <text x="100" y="540" fill="#626A73" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" letter-spacing="3">TIANCHI.BLOG · NOTEBOOK</text>
</svg>
