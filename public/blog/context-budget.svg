<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A budget bar showing context layers — permanent, task, execution">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EEF1F4"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg2)"/>
  <circle cx="160" cy="120" r="240" fill="#6E54A8" opacity="0.07"/>
  <circle cx="1040" cy="540" r="260" fill="#C76A3F" opacity="0.06"/>

  <rect x="60" y="60" width="1080" height="510" rx="32" stroke="#1C1F24" stroke-opacity="0.14" stroke-width="2" fill="none"/>

  <line x1="100" y1="130" x2="160" y2="130" stroke="#6E54A8" stroke-width="3"/>
  <text x="100" y="166" fill="#533F86" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="700" letter-spacing="3">CONTEXT</text>

  <text x="100" y="244" fill="#0F1218" font-family="Inter, system-ui, sans-serif" font-size="60" font-weight="800" letter-spacing="-2.4">Context is the</text>
  <text x="100" y="316" fill="#0F1218" font-family="Inter, system-ui, sans-serif" font-size="60" font-weight="800" letter-spacing="-2.4">agent's real budget.</text>

  <text x="100" y="370" fill="#626A73" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="500">Attention &gt; tokens. Smallest high-signal state wins.</text>

  <!-- budget bar -->
  <g transform="translate(100, 420)">
    <rect x="0" y="0" width="1000" height="56" rx="14" fill="#FFFFFF" stroke="#1C1F24" stroke-opacity="0.15" stroke-width="1.5"/>
    <!-- permanent -->
    <rect x="2" y="2" width="220" height="52" rx="13" fill="#C76A3F" opacity="0.85"/>
    <text x="112" y="34" text-anchor="middle" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="2">PERMANENT</text>

    <!-- task -->
    <rect x="222" y="2" width="380" height="52" fill="#6E54A8" opacity="0.85"/>
    <text x="412" y="34" text-anchor="middle" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="2">TASK</text>

    <!-- execution -->
    <rect x="602" y="2" width="280" height="52" fill="#4F8F6B" opacity="0.85"/>
    <text x="742" y="34" text-anchor="middle" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="2">EXECUTION</text>

    <!-- noise -->
    <rect x="882" y="2" width="116" height="52" rx="13" fill="#1C1F24" opacity="0.18"/>
    <text x="940" y="34" text-anchor="middle" fill="#1C1F24" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="2" opacity="0.7">NOISE</text>
  </g>

  <!-- legend -->
  <g transform="translate(100, 500)" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#626A73">
    <text x="0" y="14">small &amp; stable</text>
    <text x="320" y="14">explicit &amp; reviewable</text>
    <text x="700" y="14">disposable</text>
  </g>

  <text x="100" y="556" fill="#626A73" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" letter-spacing="3">TIANCHI.BLOG · NOTEBOOK</text>
</svg>
